name: Bug report
description: Report a problem with Codex Monitor.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: >
        Please do not post API keys, auth tokens, private keys, seed phrases,
        private prompts, or sensitive Codex conversation content. Check any
        screenshots and logs before attaching them.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: monitor-version
    attributes:
      label: Codex Monitor version
      placeholder: v0.1.0-beta
  - type: input
    id: windows-version
    attributes:
      label: Windows version
  - type: input
    id: vscode-version
    attributes:
      label: VS Code version
  - type: input
    id: codex-version
    attributes:
      label: Codex version, if known
  - type: textarea
    id: attachments
    attributes:
      label: Screenshot / GIF / logs
      description: Optional. Remove sensitive information before attaching files.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Optional.
